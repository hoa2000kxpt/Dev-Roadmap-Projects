<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .back-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            margin-right: 15px;
        }
        
        h1 {
            color: #333;
            font-size: 1.8em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .units-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .units-row .form-group {
            margin-bottom: 0;
        }
        
        .convert-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .result-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
            text-align: center;
        }
        
        .result-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .result-value {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }
        
        .error {
            background: #ffe0e0;
            border-left: 4px solid #ff6b6b;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">←</a>
            <h1>📏 Length Converter</h1>
        </div>
        
        <form method="POST" action="/length">
            <div class="form-group">
                <label for="value">Enter Value</label>
                <input type="number" id="value" name="value" step="any" placeholder="0" value="{{ value if value != '' else '' }}" required>
            </div>
            
            <div class="units-row">
                <div class="form-group">
                    <label for="from_unit">From</label>
                    <select id="from_unit" name="from_unit" required>
                        {% for unit in units %}
                            <option value="{{ unit }}" {% if unit == from_unit %}selected{% endif %}>{{ unit | title }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="to_unit">To</label>
                    <select id="to_unit" name="to_unit" required>
                        {% for unit in units %}
                            <option value="{{ unit }}" {% if unit == to_unit %}selected{% endif %}>{{ unit | title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <button type="submit" class="convert-btn">Convert</button>
        </form>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        {% if result is not none %}
            <div class="result-box">
                <div class="result-label">Result</div>
                <div class="result-value">{{ value }} {{ from_unit }} = {{ result }} {{ to_unit }}</div>
            </div>
        {% endif %}
    </div>
</body>
</html>
